<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ViJuris</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {

            --color-1: #9FA1FF; /* Header, Button, User Bubble */
            --color-2: #B5BAFF; /* Hover states, Focus rings */
            --color-3: #AEE2FF; /* Bot Bubble */
            --color-4: #D9F9DF; /* Page Background */
            
            --text-dark: #2d3748;
            --text-light: #ffffff;
        }

        * { 
            box-sizing: border-box; 
            font-family: 'Inter', sans-serif; 
        }
        
        body { 
            background-color: var(--color-4); 
            margin: 0; 
            padding: 20px; 
            height: 100vh;
            display: flex; 
            justify-content: center;
            align-items: center;
        }

        .chat-container { 
            width: 100%; 
            max-width: 800px; 
            background: #ffffff; 
            border-radius: 16px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.08); 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            height: 90vh; 
        }

        .header { 
            background: var(--color-1); 
            color: var(--text-light); 
            padding: 20px; 
            text-align: center; 
            font-size: 1.1em; 
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .chat-box { 
            flex: 1; 
            padding: 24px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 16px; 
            background: #fdfdfd;
        }

        .msg { 
            max-width: 80%; 
            padding: 14px 18px; 
            font-size: 0.95em;
            line-height: 1.6; 
            word-wrap: break-word; 
            animation: fadeIn 0.3s ease;
        }

        .bot-msg { 
            background: var(--color-3); 
            color: var(--text-dark); 
            align-self: flex-start; 
            border-radius: 16px 16px 16px 4px;
            white-space: pre-line; 
        }

        .user-msg { 
            background: var(--color-1); 
            color: var(--text-light); 
            align-self: flex-end; 
            border-radius: 16px 16px 4px 16px; 
        }

        .input-area { 
            display: flex; 
            padding: 20px; 
            background: #ffffff; 
            border-top: 1px solid #edf2f7;
        }

        input[type="text"] { 
            flex: 1; 
            padding: 14px 20px; 
            border: 2px solid #edf2f7; 
            border-radius: 24px; 
            outline: none; 
            font-size: 0.95em; 
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--color-2);
        }

        button { 
            background: var(--color-1); 
            color: var(--text-light); 
            border: none; 
            padding: 0 24px; 
            margin-left: 12px; 
            border-radius: 24px; 
            cursor: pointer; 
            font-weight: 600; 
            font-size: 0.95em;
            transition: all 0.2s;
        }

        button:hover { 
            background: var(--color-2); 
            transform: translateY(-1px);
        }
        
        button:active {
            transform: translateY(1px);
        }

        .typing-indicator {
            display: none;
            background: var(--color-3);
            padding: 16px 18px;
            border-radius: 16px 16px 16px 4px;
            align-self: flex-start;
            width: max-content;
        }
        
        .typing-indicator span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #555;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }
        
        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--color-2); border-radius: 10px; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">LexRAG Legal Assistant</div>
    <div class="chat-box" id="chatBox">
        <div class="msg bot-msg">Xin chào. Hệ thống hỗ trợ tra cứu pháp luật Việt Nam đã sẵn sàng.</div>
        
        <div class="typing-indicator" id="loading">
            <span></span><span></span><span></span>
        </div>
    </div>
    
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Nhập câu hỏi pháp lý..." onkeypress="handleEnter(event)" autocomplete="off">
        <button onclick="sendMessage()">Gửi</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const loading = document.getElementById('loading');

    function handleEnter(e) { 
        if (e.key === 'Enter') sendMessage(); 
    }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        appendMessage(text, 'user-msg');
        userInput.value = '';
        
        loading.style.display = 'block';
        chatBox.appendChild(loading); 
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: text })
            });
            
            const data = await response.json();
            loading.style.display = 'none';
            
            if (response.ok) {
                appendMessage(data.answer, 'bot-msg');
            } else {
                appendMessage("Hệ thống gián đoạn: " + data.detail, 'bot-msg');
            }
        } catch (error) {
            loading.style.display = 'none';
            appendMessage("Lỗi kết nối mạng. Vui lòng thử lại sau.", 'bot-msg');
        }
    }

    function appendMessage(text, className) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${className}`;
        msgDiv.innerText = text;
        chatBox.insertBefore(msgDiv, loading); 
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
