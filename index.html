<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trợ lý AI Pháp lý</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 600px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); overflow: hidden; display: flex; flex-direction: column; height: 80vh; }
        .header { background: #0068ff; color: white; padding: 15px; text-align: center; font-size: 1.2em; font-weight: bold; }
        .chat-box { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 20px; line-height: 1.4; word-wrap: break-word; }
        .user-msg { background: #0068ff; color: white; align-self: flex-end; border-bottom-right-radius: 0; }
        .bot-msg { background: #e5e5ea; color: black; align-self: flex-start; border-bottom-left-radius: 0; white-space: pre-line; }
        .input-area { display: flex; padding: 15px; border-top: 1px solid #ddd; background: #fff; }
        input[type="text"] { flex: 1; padding: 12px; border: 1px solid #ddd; border-radius: 20px; outline: none; font-size: 1em; }
        button { background: #0068ff; color: white; border: none; padding: 0 20px; margin-left: 10px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056d6; }
        .loading { font-size: 0.9em; color: #888; align-self: flex-start; display: none; }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="header">⚖️ Trợ lý Pháp luật VN</div>
    <div class="chat-box" id="chatBox">
        <div class="msg bot-msg">Xin chào! Tôi là AI tra cứu pháp luật Việt Nam. Tôi có thể giúp gì cho bạn?</div>
        <div class="loading" id="loading">🤖 AI đang tra cứu luật và suy luận...</div>
    </div>
    <div class="input-area">
        <input type="text" id="userInput" placeholder="Nhập tình huống pháp lý..." onkeypress="handleEnter(event)">
        <button onclick="sendMessage()">Gửi</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chatBox');
    const userInput = document.getElementById('userInput');
    const loading = document.getElementById('loading');

    function handleEnter(e) { if (e.key === 'Enter') sendMessage(); }

    async function sendMessage() {
        const text = userInput.value.trim();
        if (!text) return;

        // 1. In câu hỏi của user ra màn hình
        appendMessage(text, 'user-msg');
        userInput.value = '';
        
        // Hiển thị chữ loading
        loading.style.display = 'block';
        chatBox.appendChild(loading); // Đẩy loading xuống cuối
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            // 2. Gọi API FastAPI Backend
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ question: text })
            });
            
            const data = await response.json();
            loading.style.display = 'none';
            
            if (response.ok) {
                appendMessage(data.answer, 'bot-msg');
            } else {
                appendMessage("Lỗi máy chủ: " + data.detail, 'bot-msg');
            }
        } catch (error) {
            loading.style.display = 'none';
            appendMessage("Không thể kết nối tới Server AI.", 'bot-msg');
        }
    }

    function appendMessage(text, className) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${className}`;
        msgDiv.innerText = text;
        chatBox.insertBefore(msgDiv, loading); 
        chatBox.scrollTop = chatBox.scrollHeight;
    }
</script>

</body>
</html>
